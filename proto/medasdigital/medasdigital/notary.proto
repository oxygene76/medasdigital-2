syntax = "proto3";
package medasdigital.medasdigital;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "medasdigital/x/medasdigital/types";

// Commit is a notarised commitment, see docs/notary-spec.md.
message Commit {
  // id is assigned by the module, starting at 1.
  uint64 id = 1;

  // version is the hash protocol version, set by the module (currently 1).
  uint32 version = 2;

  // creator signed the MsgCommit. The hash binds the payload to this address.
  string creator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // hash is SHA-256 over the v1 preimage (exactly 32 bytes).
  bytes hash = 4;

  // schema names the payload format, 1-64 bytes of [a-z0-9._-]. Public.
  string schema = 5;

  // label is an optional public note (valid UTF-8, max params.max_label_length bytes).
  string label = 6;

  // commit_height is the block height of the MsgCommit.
  int64 commit_height = 7;

  // commit_time is the block time (BFT time) of the MsgCommit.
  google.protobuf.Timestamp commit_time = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true,
    (amino.dont_omitempty) = true
  ];

  // revealed is true once a valid MsgReveal was processed.
  bool revealed = 9;

  // revealer signed the MsgReveal (any address). Empty until revealed.
  string revealer = 10 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // salt is the 32-byte salt. Empty until revealed.
  bytes salt = 11;

  // payload is the revealed content. Empty until revealed.
  bytes payload = 12;

  // reveal_height is the block height of the MsgReveal. 0 until revealed.
  int64 reveal_height = 13;

  // reveal_time is the block time of the MsgReveal. Unset until revealed.
  google.protobuf.Timestamp reveal_time = 14 [(gogoproto.stdtime) = true];
}

// EventCommitCreated is emitted when a commit is stored.
message EventCommitCreated {
  uint64 id = 1;
  string creator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // hash_hex is the lowercase hex encoding of the 32-byte hash.
  string hash_hex = 3;
  string schema = 4;
}

// EventCommitRevealed is emitted when a commit is revealed.
message EventCommitRevealed {
  uint64 id = 1;
  string creator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string revealer = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
